name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: ./test.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pp
          path: ./pp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.refs == 'refs/heads/main'

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: pp

      - name: Deploy
        run: |
          mkdir -p fake-server
          cp pp fake-server/pp
          chmod +x fake-server/pp

      - name: Verify deployment
        run: |
          ls -l fake-server/pp
          ./fake-server/pp
