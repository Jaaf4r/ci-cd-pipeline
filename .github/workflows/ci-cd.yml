name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build
        run: make CXX=${{ matrix.compiler }}

      - name: Test
        run: make test

      - name: Upload Artifact
        if: matrix.compiler == 'g++'
        uses: actions/upload-artifact@v4
        with:
          name: pp
          path: ./pp
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: pp

      - name: Deploy
        run: |
          mkdir -p fake-server
          cp pp fake-server/pp
          chmod +x fake-server/pp

      - name: Verify deployment
        run: |
          ls -l fake-server/pp
          ./fake-server/pp
