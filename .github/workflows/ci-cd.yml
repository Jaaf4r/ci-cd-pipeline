name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: build
        run: make

      - name: test
        run: ./test.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pp
          path: ./pp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: pp
        
      - name: Deploy
        run: |
          mkdir -p fake-server
          cp pp fake-server/pp

      - name: Verify deployment
        run: |
          ls -l fake-server
          ./fake-server/pp
